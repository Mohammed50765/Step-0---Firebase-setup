<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="أيقونة ميدان 6v6 القابلة للتكيّف">
  <defs>
    <radialGradient id="mBgRadial" cx="50%" cy="42%" r="64%">
      <stop offset="0%" stop-color="#27200C"/>
      <stop offset="50%" stop-color="#111218"/>
      <stop offset="100%" stop-color="#070709"/>
    </radialGradient>
    <radialGradient id="mCrownAura" cx="50%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#CA8A04" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mGold24k" x1="12%" y1="4%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="22%" stop-color="#FACC15"/>
      <stop offset="52%" stop-color="#CA8A04"/>
      <stop offset="78%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="mGoldVert" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="28%" stop-color="#FDE047"/>
      <stop offset="66%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="mSilverPlate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="38%" stop-color="#E4E4E7"/>
      <stop offset="62%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#F4F4F5"/>
    </linearGradient>
    <linearGradient id="mShieldBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E202B"/>
      <stop offset="48%" stop-color="#0D0F15"/>
      <stop offset="100%" stop-color="#07070A"/>
    </linearGradient>
    <radialGradient id="mBallPanelGold" cx="44%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="42%" stop-color="#FACC15"/>
      <stop offset="85%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
    <filter id="mCrestDrop" x="-14%" y="-12%" width="128%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.78"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FACC15" flood-opacity="0.22"/>
    </filter>
    <clipPath id="mBallDomeClip">
      <circle cx="256" cy="212" r="100"/>
    </clipPath>
  </defs>

  <!-- Full-bleed solid safe backdrop -->
  <rect width="512" height="512" fill="url(#mBgRadial)"/>
  <rect width="512" height="512" fill="url(#mCrownAura)"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#FACC15" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Centered Crest Scaled Inside 74% Safe Zone (13% margin all around) -->
  <g transform="translate(256 260) scale(0.74) translate(-256 -256)" filter="url(#mCrestDrop)">
    <g fill="url(#mGold24k)" stroke="#070709" stroke-width="3.5" stroke-linejoin="round">
      <path d="M98 282 C 62 246, 56 186, 86 138 C 94 176, 102 204, 122 232 Z"/>
      <path d="M414 282 C 450 246, 456 186, 426 138 C 418 176, 410 204, 390 232 Z"/>
    </g>

    <path d="M256 96 L414 146 L402 308 C396 364 338 418 256 462 C174 418 116 364 110 308 L98 146 Z"
          fill="url(#mGold24k)" stroke="#070709" stroke-width="4" stroke-linejoin="round"/>
    <path d="M256 110 L400 156 L389 306 C384 355 331 404 256 445 C181 404 128 355 123 306 L112 156 Z"
          fill="#090A0E"/>
    <path d="M256 122 L388 164 L378 304 C373 347 325 392 256 430 C187 392 139 347 134 304 L124 164 Z"
          fill="url(#mShieldBody)" stroke="url(#mGold24k)" stroke-width="4"/>

    <g clip-path="url(#mBallDomeClip)">
      <circle cx="256" cy="212" r="100" fill="url(#mBallPanelGold)"/>
      <g fill="#0E1016" stroke="#FACC15" stroke-width="4.5" stroke-linejoin="round">
        <polygon points="154,186 208,142 238,162 204,218 158,214"/>
        <polygon points="358,186 304,142 274,162 308,218 354,214"/>
        <polygon points="228,112 284,112 298,136 256,154 214,136"/>
      </g>
      <polygon points="256,154 302,178 292,232 220,232 210,178" fill="none" stroke="#FFFBEB" stroke-opacity="0.38" stroke-width="3"/>
    </g>
    <path d="M160 226 A 98 98 0 0 1 352 226" fill="none" stroke="url(#mGold24k)" stroke-width="6.5" stroke-linecap="round"/>

    <g transform="translate(256, 86)">
      <path d="M-64 34 L-78 -14 L-40 8 L-28 -26 L-8 4 L0 -42 L8 4 L28 -26 L40 8 L78 -14 L64 34 Z"
            fill="url(#mGoldVert)" stroke="#070709" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-62 32 Q 0 16 62 32 L58 46 Q 0 30 -58 46 Z"
            fill="url(#mGold24k)" stroke="#070709" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="0,-16 11,-2 0,12 -11,-2" fill="#0B0C10" stroke="#FEF08A" stroke-width="3"/>
      <circle cx="0" cy="-42" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="2.5"/>
      <circle cx="-78" cy="-14" r="5.5" fill="#FEF08A" stroke="#92400E" stroke-width="2"/>
      <circle cx="78" cy="-14" r="5.5" fill="#FEF08A" stroke="#92400E" stroke-width="2"/>
    </g>

    <g transform="translate(256, 260)">
      <text x="0" y="0" text-anchor="middle"
            font-family="'Arial Black', 'Segoe UI Black', Impact, system-ui, sans-serif"
            font-weight="900" font-size="112" letter-spacing="-3"
            fill="url(#mGoldVert)" stroke="#070709" stroke-width="18" stroke-linejoin="round" paint-order="stroke">6v6</text>
      <text x="0" y="0" text-anchor="middle"
            font-family="'Arial Black', 'Segoe UI Black', Impact, system-ui, sans-serif"
            font-weight="900" font-size="112" letter-spacing="-3"
            fill="none" stroke="#FEF9C3" stroke-opacity="0.42" stroke-width="2.2" stroke-linejoin="round">6v6</text>
    </g>

    <g transform="translate(256, 318)">
      <path d="M-190 -36 Q 0 -48 190 -36 L176 38 Q 0 24 -176 38 Z"
            fill="#090A0F" stroke="url(#mGold24k)" stroke-width="6.5" stroke-linejoin="round"/>
      <text x="0" y="21" text-anchor="middle"
            font-family="'Arial Black', 'Segoe UI Black', Impact, system-ui, sans-serif"
            font-weight="900" font-size="70" letter-spacing="4"
            fill="url(#mSilverPlate)" stroke="#070709" stroke-width="7" stroke-linejoin="round" paint-order="stroke">MIDAN</text>
    </g>

    <path d="M174 376 Q 256 418 338 376" fill="none" stroke="#FACC15" stroke-width="4" stroke-linecap="round" opacity="0.52"/>
    <polygon points="256,386 270,402 256,418 242,402" fill="url(#mGoldVert)" stroke="#070709" stroke-width="2.5"/>
  </g>
</svg>
