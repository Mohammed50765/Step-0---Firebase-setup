<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="أيقونة ميدان 6v6 — MIDAN">
  <defs>
    <!-- Deep Royal Obsidian Backdrop -->
    <radialGradient id="bgRadial" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#27200C"/>
      <stop offset="46%" stop-color="#111218"/>
      <stop offset="100%" stop-color="#070709"/>
    </radialGradient>

    <!-- Warm Crown Aura -->
    <radialGradient id="crownAura" cx="50%" cy="22%" r="44%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#CA8A04" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>

    <!-- 24K Metallic Gold Bevel -->
    <linearGradient id="gold24k" x1="12%" y1="4%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="22%" stop-color="#FACC15"/>
      <stop offset="52%" stop-color="#CA8A04"/>
      <stop offset="78%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Vertical Gold for 6v6 & Crown -->
    <linearGradient id="goldVert" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="28%" stop-color="#FDE047"/>
      <stop offset="66%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <!-- Brushed Platinum Silver for MIDAN -->
    <linearGradient id="silverPlate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="38%" stop-color="#E4E4E7"/>
      <stop offset="62%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#F4F4F5"/>
    </linearGradient>

    <!-- Obsidian Faceted Shield Body -->
    <linearGradient id="shieldBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E202B"/>
      <stop offset="48%" stop-color="#0D0F15"/>
      <stop offset="100%" stop-color="#07070A"/>
    </linearGradient>

    <!-- Football Golden Panel Gradient -->
    <radialGradient id="ballPanelGold" cx="44%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="42%" stop-color="#FACC15"/>
      <stop offset="85%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>

    <!-- Subtle Ambient Orbit Arc -->
    <linearGradient id="orbitGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FEF08A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0"/>
    </linearGradient>

    <!-- Shield Drop Shadow -->
    <filter id="crestDrop" x="-14%" y="-12%" width="128%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.78"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FACC15" flood-opacity="0.22"/>
    </filter>

    <clipPath id="ballDomeClip">
      <circle cx="256" cy="212" r="100"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Obsidian Background -->
  <rect width="512" height="512" fill="url(#bgRadial)"/>
  <rect width="512" height="512" fill="url(#crownAura)"/>

  <!-- Subtle Golden Halo Arc (echoing the crest orbit) -->
  <ellipse cx="256" cy="204" rx="198" ry="118" fill="none" stroke="url(#orbitGold)" stroke-width="2.5" opacity="0.55"/>

  <g filter="url(#crestDrop)">
    <!-- Simplified Bold Golden Laurel Wings (Left & Right) -->
    <g fill="url(#gold24k)" stroke="#070709" stroke-width="3" stroke-linejoin="round">
      <!-- Left Laurel Wing -->
      <path d="M98 282 C 62 246, 56 186, 86 138 C 94 176, 102 204, 122 232 Z"/>
      <path d="M88 242 C 68 214, 68 178, 86 150 C 90 178, 96 202, 110 222 Z" fill="#FEF08A" opacity="0.55" stroke="none"/>
      <!-- Right Laurel Wing -->
      <path d="M414 282 C 450 246, 456 186, 426 138 C 418 176, 410 204, 390 232 Z"/>
      <path d="M424 242 C 444 214, 444 178, 426 150 C 422 178, 416 202, 402 222 Z" fill="#FEF08A" opacity="0.55" stroke="none"/>
    </g>

    <!-- Outer Beveled Royal Shield -->
    <path d="M256 96 L414 146 L402 308 C396 364 338 418 256 462 C174 418 116 364 110 308 L98 146 Z"
          fill="url(#gold24k)" stroke="#070709" stroke-width="4" stroke-linejoin="round"/>

    <!-- Recessed Obsidian Rim -->
    <path d="M256 110 L400 156 L389 306 C384 355 331 404 256 445 C181 404 128 355 123 306 L112 156 Z"
          fill="#090A0E"/>

    <!-- Inner Obsidian Shield Core -->
    <path d="M256 122 L388 164 L378 304 C373 347 325 392 256 430 C187 392 139 347 134 304 L124 164 Z"
          fill="url(#shieldBody)" stroke="url(#gold24k)" stroke-width="4"/>

    <!-- Black & Gold Football Dome Peeking at Top of Shield -->
    <g clip-path="url(#ballDomeClip)">
      <circle cx="256" cy="212" r="100" fill="url(#ballPanelGold)"/>
      <!-- Dark Obsidian Football Panels (classic bold pattern) -->
      <g fill="#0E1016" stroke="#FACC15" stroke-width="4.5" stroke-linejoin="round">
        <!-- Upper-left dark panel -->
        <polygon points="154,186 208,142 238,162 204,218 158,214"/>
        <!-- Upper-right dark panel -->
        <polygon points="358,186 304,142 274,162 308,218 354,214"/>
        <!-- Top crown-base dark crest seam -->
        <polygon points="228,112 284,112 298,136 256,154 214,136"/>
      </g>
      <!-- Center golden hexagon highlight lines -->
      <polygon points="256,154 302,178 292,232 220,232 210,178" fill="none" stroke="#FFFBEB" stroke-opacity="0.38" stroke-width="3"/>
    </g>
    <!-- Crisp Gold Football Dome Ring -->
    <path d="M160 226 A 98 98 0 0 1 352 226" fill="none" stroke="url(#gold24k)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- 5-Point Royal Crown Perched Atop Football -->
    <g transform="translate(256, 86)">
      <path d="M-64 34 L-78 -14 L-40 8 L-28 -26 L-8 4 L0 -42 L8 4 L28 -26 L40 8 L78 -14 L64 34 Z"
            fill="url(#goldVert)" stroke="#070709" stroke-width="5" stroke-linejoin="round"/>
      <!-- Crown Base Band -->
      <path d="M-62 32 Q 0 16 62 32 L58 46 Q 0 30 -58 46 Z"
            fill="url(#gold24k)" stroke="#070709" stroke-width="4" stroke-linejoin="round"/>
      <!-- Center Crown Diamond Jewel -->
      <polygon points="0,-16 11,-2 0,12 -11,-2" fill="#0B0C10" stroke="#FEF08A" stroke-width="3"/>
      <!-- Apex Gold Jewels -->
      <circle cx="0" cy="-42" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="2.5"/>
      <circle cx="-78" cy="-14" r="5.5" fill="#FEF08A" stroke="#92400E" stroke-width="2"/>
      <circle cx="78" cy="-14" r="5.5" fill="#FEF08A" stroke="#92400E" stroke-width="2"/>
    </g>

    <!-- Bold Metallic 24K Gold "6v6" Focal Emblem -->
    <g transform="translate(256, 260)">
      <text x="0" y="0" text-anchor="middle"
            font-family="'Arial Black', 'Segoe UI Black', Impact, system-ui, sans-serif"
            font-weight="900" font-size="112" letter-spacing="-3"
            fill="url(#goldVert)" stroke="#070709" stroke-width="18" stroke-linejoin="round" paint-order="stroke">6v6</text>
      <text x="0" y="0" text-anchor="middle"
            font-family="'Arial Black', 'Segoe UI Black', Impact, system-ui, sans-serif"
            font-weight="900" font-size="112" letter-spacing="-3"
            fill="none" stroke="#FEF9C3" stroke-opacity="0.42" stroke-width="2.2" stroke-linejoin="round">6v6</text>
    </g>

    <!-- Chamfered Ribbon Banner Holding Silver "MIDAN" -->
    <g transform="translate(256, 318)">
      <!-- Ribbon Backing Plate -->
      <path d="M-190 -36 Q 0 -48 190 -36 L176 38 Q 0 24 -176 38 Z"
            fill="#090A0F" stroke="url(#gold24k)" stroke-width="6.5" stroke-linejoin="round"/>
      <!-- Brushed Platinum-Silver "MIDAN" Typography -->
      <text x="0" y="21" text-anchor="middle"
            font-family="'Arial Black', 'Segoe UI Black', Impact, system-ui, sans-serif"
            font-weight="900" font-size="70" letter-spacing="4"
            fill="url(#silverPlate)" stroke="#070709" stroke-width="7" stroke-linejoin="round" paint-order="stroke">MIDAN</text>
    </g>

    <!-- Clean Simplified Royal Shield Base (No Tiny Unreadable Text) -->
    <path d="M174 376 Q 256 418 338 376" fill="none" stroke="#FACC15" stroke-width="4" stroke-linecap="round" opacity="0.52"/>
    <polygon points="256,386 270,402 256,418 242,402" fill="url(#goldVert)" stroke="#070709" stroke-width="2.5"/>
  </g>
</svg>
