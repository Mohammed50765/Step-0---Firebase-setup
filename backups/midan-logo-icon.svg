<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="أيقونة ميدان 6v6 — النسخة الملكية">
  <defs>
    <!-- Deep Royal Obsidian Background -->
    <radialGradient id="bgGlow" cx="50%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#231D0B"/>
      <stop offset="48%" stop-color="#111218"/>
      <stop offset="100%" stop-color="#070709"/>
    </radialGradient>

    <!-- Top Ambient Gold Halo -->
    <radialGradient id="topHalo" cx="50%" cy="14%" r="48%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#CA8A04" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>

    <!-- 24K Metallic Gold Frame Gradient -->
    <linearGradient id="goldBevel" x1="12%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="22%" stop-color="#FACC15"/>
      <stop offset="52%" stop-color="#CA8A04"/>
      <stop offset="76%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Inner Specular Gold Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="45%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <!-- Faceted Obsidian Shield Interior -->
    <linearGradient id="shieldCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1D1F2A"/>
      <stop offset="45%" stop-color="#0E1016"/>
      <stop offset="100%" stop-color="#07070A"/>
    </linearGradient>

    <!-- Subtle Left-Half Facet Highlight -->
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#FACC15" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Football Sphere Metallic Gold -->
    <radialGradient id="ballGold" cx="38%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="32%" stop-color="#FACC15"/>
      <stop offset="76%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>

    <!-- Football Obsidian Core -->
    <radialGradient id="ballObsidian" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#1D202C"/>
      <stop offset="65%" stop-color="#0D0F16"/>
      <stop offset="100%" stop-color="#06070A"/>
    </radialGradient>

    <!-- Subtle Background Gold Wave Lines -->
    <linearGradient id="waveLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FACC15" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for Shield -->
    <filter id="shieldShadow" x="-16%" y="-14%" width="132%" height="134%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.72"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FACC15" flood-opacity="0.18"/>
    </filter>

    <clipPath id="innerShieldClip">
      <path d="M256 88 L384 128 C392 130.5 397 137.5 397 146 L397 268 C397 346 336 404 256 436 C176 404 115 346 115 268 L115 146 C115 137.5 120 130.5 128 128 Z"/>
    </clipPath>

    <clipPath id="ballInnerClip">
      <circle cx="0" cy="0" r="82"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Royal Obsidian Backdrop -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>
  <rect width="512" height="512" fill="url(#topHalo)"/>

  <!-- Flowing Liquid Gold Background Waves -->
  <g fill="none">
    <path d="M-20 156 Q 128 112, 256 156 T 532 148" stroke="url(#waveLine)" stroke-width="2.5"/>
    <path d="M-20 356 Q 134 398, 256 352 T 532 362" stroke="url(#waveLine)" stroke-width="2"/>
    <path d="M-20 410 Q 150 448, 286 404 T 532 414" stroke="#FACC15" stroke-opacity="0.1" stroke-width="1.5"/>
  </g>

  <!-- Main Sculpted Royal Shield Group -->
  <g filter="url(#shieldShadow)">
    <!-- Outer Beveled Gold Shield Plate -->
    <path d="M256 64 L402 110 C414 114 422 125 422 138 L422 271 C422 361 350 426 256 462 C162 426 90 361 90 271 L90 138 C90 125 98 114 110 110 Z"
          fill="url(#goldBevel)"/>

    <!-- Dark Recessed Chamfer -->
    <path d="M256 76 L392 119 C402 122 409 131 409 142 L409 270 C409 353 343 414 256 448 C169 414 103 353 103 270 L103 142 C103 131 110 122 120 119 Z"
          fill="#0B0C10"/>

    <!-- Inner Obsidian Faceted Shield Body -->
    <path d="M256 88 L384 128 C392 130.5 397 137.5 397 146 L397 268 C397 346 336 404 256 436 C176 404 115 346 115 268 L115 146 C115 137.5 120 130.5 128 128 Z"
          fill="url(#shieldCore)" stroke="url(#goldRim)" stroke-width="4"/>

    <!-- Geometric Architectural Facets Inside Shield -->
    <g clip-path="url(#innerShieldClip)">
      <path d="M115 88 L256 88 L256 436 L115 436 Z" fill="url(#facetLight)"/>
      <path d="M90 198 L272 78 L330 78 L110 264 Z" fill="#FEF9C3" fill-opacity="0.06"/>
      <path d="M115 304 L256 382 L397 304" fill="none" stroke="#FACC15" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round"/>
      <path d="M132 332 L256 402 L380 332" fill="none" stroke="#FACC15" stroke-opacity="0.34" stroke-width="3" stroke-linecap="round"/>
      <line x1="256" y1="90" x2="256" y2="432" stroke="#FEF08A" stroke-opacity="0.14" stroke-width="2"/>
    </g>

    <!-- Minimalist Royal Crown at Shield Apex -->
    <g transform="translate(256, 146)">
      <path d="M-46 14 L-54 -18 L-24 -2 L0 -26 L24 -2 L54 -18 L46 14 Z"
            fill="url(#goldBevel)" stroke="#070709" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="-46" y="15" width="92" height="9" rx="4.5" fill="url(#goldRim)"/>
      <circle cx="0" cy="-26" r="5" fill="#FFFBEB"/>
    </g>

    <!-- Mathematically Symmetric 5-Fold Golden Football Emblem -->
    <g transform="translate(256, 266)">
      <!-- Obsidian Sphere Body -->
      <circle r="86" fill="url(#ballObsidian)"/>

      <!-- Clipped 5-Fold Spokes & Perimeter Wedges -->
      <g clip-path="url(#ballInnerClip)">
        <!-- Subtle inner hexagon/pentagon seam ring -->
        <circle r="60" fill="none" stroke="#FACC15" stroke-opacity="0.18" stroke-width="2"/>

        <g transform="rotate(0)">
          <line x1="0" y1="-32" x2="0" y2="-61" stroke="#FACC15" stroke-width="6.5" stroke-linecap="round"/>
          <polygon points="0,-59 24,-73 16,-92 -16,-92 -24,-73" fill="url(#ballGold)" stroke="#070709" stroke-width="3"/>
        </g>
        <g transform="rotate(72)">
          <line x1="0" y1="-32" x2="0" y2="-61" stroke="#FACC15" stroke-width="6.5" stroke-linecap="round"/>
          <polygon points="0,-59 24,-73 16,-92 -16,-92 -24,-73" fill="url(#ballGold)" stroke="#070709" stroke-width="3"/>
        </g>
        <g transform="rotate(144)">
          <line x1="0" y1="-32" x2="0" y2="-61" stroke="#FACC15" stroke-width="6.5" stroke-linecap="round"/>
          <polygon points="0,-59 24,-73 16,-92 -16,-92 -24,-73" fill="url(#ballGold)" stroke="#070709" stroke-width="3"/>
        </g>
        <g transform="rotate(216)">
          <line x1="0" y1="-32" x2="0" y2="-61" stroke="#FACC15" stroke-width="6.5" stroke-linecap="round"/>
          <polygon points="0,-59 24,-73 16,-92 -16,-92 -24,-73" fill="url(#ballGold)" stroke="#070709" stroke-width="3"/>
        </g>
        <g transform="rotate(288)">
          <line x1="0" y1="-32" x2="0" y2="-61" stroke="#FACC15" stroke-width="6.5" stroke-linecap="round"/>
          <polygon points="0,-59 24,-73 16,-92 -16,-92 -24,-73" fill="url(#ballGold)" stroke="#070709" stroke-width="3"/>
        </g>
      </g>

      <!-- Outer Beveled Gold Sphere Ring -->
      <circle r="85" fill="none" stroke="url(#goldBevel)" stroke-width="9"/>

      <!-- Center Royal 24K Gold Pentagon -->
      <polygon points="0,-35 33.3,-10.8 20.6,28.3 -20.6,28.3 -33.3,-10.8"
               fill="url(#ballGold)" stroke="#070709" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Specular highlight facet inside pentagon -->
      <polygon points="0,-29 25,-9.5 0,-2 -25,-9.5" fill="#FFFBEB" fill-opacity="0.45"/>
    </g>

    <!-- Bottom Crest Diamond Point -->
    <polygon points="256,392 269,406 256,420 243,406" fill="url(#goldRim)"/>
  </g>
</svg>
