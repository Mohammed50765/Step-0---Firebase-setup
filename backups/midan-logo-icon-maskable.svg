  <!-- Full-bleed solid safe backdrop for maskable icons -->
  <rect width="512" height="512" fill="url(#mBgGlow)"/>
  <rect width="512" height="512" fill="url(#mTopHalo)"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#FACC15" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Centered Crest Scaled to 74% Safe Zone (13% padding on all edges) -->
  <g transform="translate(256 256) scale(0.74) translate(-256 -260)" filter="url(#mShieldShadow)">
    <path d="M256 64 L402 110 C414 114 422 125 422 138 L422 271 C422 361 350 426 256 462 C162 426 90 361 90 271 L90 138 C90 125 98 114 110 110 Z"
