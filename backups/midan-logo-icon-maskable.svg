      <stop offset="32%" stop-color="#FACC15"/>
      <stop offset="76%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
    <radialGradient id="mBallObsidian" cx="38%" cy="30%" r="72%">
