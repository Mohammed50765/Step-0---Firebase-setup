      <rect x="-46" y="15" width="92" height="9" rx="4.5" fill="url(#mGoldRim)"/>
      <circle cx="0" cy="-26" r="5.5" fill="#FFFBEB"/>
    </g>

    <g transform="translate(256, 266)">
      <circle r="86" fill="url(#mBallObsidian)"/>
      <g clip-path="url(#mBallInnerClip)">
        <circle r="60" fill="none" stroke="#FACC15" stroke-opacity="0.18" stroke-width="2"/>
        <g transform="rotate(0)">
          <line x1="0" y1="-32" x2="0" y2="-61" stroke="#FACC15" stroke-width="7" stroke-linecap="round"/>
          <polygon points="0,-59 24,-73 16,-92 -16,-92 -24,-73" fill="url(#mBallGold)" stroke="#070709" stroke-width="3"/>
        </g>
        <g transform="rotate(72)">
          <line x1="0" y1="-32" x2="0" y2="-61" stroke="#FACC15" stroke-width="7" stroke-linecap="round"/>
          <polygon points="0,-59 24,-73 16,-92 -16,-92 -24,-73" fill="url(#mBallGold)" stroke="#070709" stroke-width="3"/>
        </g>
        <g transform="rotate(144)">
          <line x1="0" y1="-32" x2="0" y2="-61" stroke="#FACC15" stroke-width="7" stroke-linecap="round"/>
          <polygon points="0,-59 24,-73 16,-92 -16,-92 -24,-73" fill="url(#mBallGold)" stroke="#070709" stroke-width="3"/>
        </g>
        <g transform="rotate(216)">
          <line x1="0" y1="-32" x2="0" y2="-61" stroke="#FACC15" stroke-width="7" stroke-linecap="round"/>
          <polygon points="0,-59 24,-73 16,-92 -16,-92 -24,-73" fill="url(#mBallGold)" stroke="#070709" stroke-width="3"/>
        </g>
        <g transform="rotate(288)">
          <line x1="0" y1="-32" x2="0" y2="-61" stroke="#FACC15" stroke-width="7" stroke-linecap="round"/>
          <polygon points="0,-59 24,-73 16,-92 -16,-92 -24,-73" fill="url(#mBallGold)" stroke="#070709" stroke-width="3"/>
        </g>
      </g>
      <circle r="85" fill="none" stroke="url(#mGoldBevel)" stroke-width="9.5"/>
      <polygon points="0,-35 33.3,-10.8 20.6,28.3 -20.6,28.3 -33.3,-10.8"
               fill="url(#mBallGold)" stroke="#070709" stroke-width="4.5" stroke-linejoin="round"/>
      <polygon points="0,-29 25,-9.5 0,-2 -25,-9.5" fill="#FFFBEB" fill-opacity="0.45"/>
    </g>

    <polygon points="256,392 269,406 256,420 243,406" fill="url(#mGoldRim)"/>
  </g>
</svg>
