<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="أيقونة ميدان 6v6 القابلة للتكيّف">
  <defs>
    <radialGradient id="mBgGlow" cx="50%" cy="38%" r="64%">
      <stop offset="0%" stop-color="#241E0C"/>
      <stop offset="52%" stop-color="#111218"/>
      <stop offset="100%" stop-color="#070709"/>
    </radialGradient>
    <radialGradient id="mTopHalo" cx="50%" cy="22%" r="44%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.30"/>
      <stop offset="58%" stop-color="#CA8A04" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mGoldBevel" x1="12%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="22%" stop-color="#FACC15"/>
      <stop offset="52%" stop-color="#CA8A04"/>
      <stop offset="76%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="mGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="45%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="mShieldCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1D1F2A"/>
