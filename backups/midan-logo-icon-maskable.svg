      <path d="M90 198 L272 78 L330 78 L110 264 Z" fill="#FEF9C3" fill-opacity="0.06"/>
      <path d="M115 304 L256 382 L397 304" fill="none" stroke="#FACC15" stroke-opacity="0.24" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M132 332 L256 402 L380 332" fill="none" stroke="#FACC15" stroke-opacity="0.36" stroke-width="3.5" stroke-linecap="round"/>
