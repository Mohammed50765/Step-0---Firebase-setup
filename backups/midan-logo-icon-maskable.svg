      <stop offset="60%" stop-color="#FACC15" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mBallGold" cx="38%" cy="30%" r="68%">
